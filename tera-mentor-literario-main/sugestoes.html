<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travez — Sugestões da IA Travez</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#F3E8DB; --bg2:#FFFFFF; --bg3:#FAF6F1;
  --cream:#1E3A2F; --cream2:#2D5243; --muted:#7A8A70;
  --gold:#C26A3A; --border:rgba(30,58,47,.08);
}
html { -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
body {
  background:radial-gradient(ellipse 70% 50% at 30% 20%,#DDD0C4 0%,#C3B49E 100%);
  display:flex; justify-content:center; align-items:center;
  min-height:100vh; font-family:'Inter',sans-serif;
}
.phone {
  width:390px; height:844px; background:var(--bg);
  border-radius:52px; overflow:hidden; position:relative;
  box-shadow:0 0 0 1px rgba(30,58,47,.06),0 60px 120px rgba(30,58,47,.28),0 0 80px rgba(194,106,58,.08),inset 0 1px 0 rgba(255,255,255,.9);
}
.phone::before {
  content:''; position:absolute; top:14px; left:50%;
  transform:translateX(-50%);
  width:118px; height:34px; background:#E2D6C8; border-radius:20px; z-index:100;
}
.page {
  height:100%; overflow-y:auto; scrollbar-width:none;
  padding:92px 32px 44px;
}
.page::-webkit-scrollbar { display:none; }
.eyebrow {
  font-size:9px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  color:var(--gold); opacity:.75; margin-bottom:10px;
}
h1 {
  font-family:'Lora',serif;
  font-size:27px; line-height:1.22; letter-spacing:-.02em;
  color:var(--cream); margin-bottom:10px; font-style:italic;
}
.intro {
  font-size:13.5px; color:var(--muted); line-height:1.75;
  margin-bottom:22px;
}
.travez-panel {
  background:linear-gradient(160deg,rgba(194,106,58,.07),rgba(194,106,58,.02));
  border:1px solid rgba(194,106,58,.16); border-radius:18px;
  padding:16px; margin-bottom:16px;
}
.travez-question {
  font-family:'Lora',serif;
  font-size:19px; line-height:1.35; color:var(--cream);
  font-style:italic; margin-bottom:14px;
}
.travez-options { display:flex; flex-direction:column; gap:10px; }
.travez-option {
  width:100%; padding:14px;
  background:var(--bg2);
  border:1px solid var(--border); border-radius:14px;
  color:var(--cream2); font-size:13.2px; line-height:1.35;
  font-family:'Inter',sans-serif; text-align:left; cursor:pointer;
  transition:border-color .2s, background .2s, transform .15s, box-shadow .2s;
  box-shadow:0 1px 6px rgba(30,58,47,.04);
}
.travez-option:hover,
.travez-option.selected {
  border-color:rgba(194,106,58,.35);
  background:var(--bg3);
  transform:translateY(-1px);
  box-shadow:0 4px 14px rgba(30,58,47,.08);
}
.travez-option:disabled { cursor:wait; opacity:.72; transform:none; }
.travez-status {
  font-size:12.5px; color:var(--muted); line-height:1.55;
  padding:2px 0 14px; font-style:italic;
}
.travez-status.error { color:#D9A05F; }
.travez-results { display:flex; flex-direction:column; gap:14px; }
.travez-rec {
  background:var(--bg2);
  border:1px solid var(--border); border-radius:16px;
  padding:16px; box-shadow:0 2px 10px rgba(30,58,47,.06);
}
.rec-title {
  font-family:'Lora',serif;
  font-size:20px; color:var(--cream); line-height:1.2;
}
.rec-author { font-size:12px; color:var(--gold); margin:4px 0 14px; }
.rec-label {
  font-size:8.5px; font-weight:700; letter-spacing:.15em; text-transform:uppercase;
  color:var(--gold); opacity:.72; margin-bottom:5px;
}
.rec-text { font-size:12.8px; color:var(--cream2); line-height:1.62; margin-bottom:11px; }
.rec-invite {
  font-family:'Lora',serif;
  font-size:15px; color:var(--cream); line-height:1.55;
  font-style:italic; margin-bottom:14px;
}
.amazon-link {
  display:inline-flex; justify-content:center; align-items:center;
  width:100%; min-height:42px; padding:12px 14px;
  background:linear-gradient(135deg,#C26A3A 0%,#9E5228 100%);
  border-radius:13px; color:#F3E8DB; text-decoration:none;
  font-size:13.5px; font-weight:600;
  box-shadow:0 4px 16px rgba(194,106,58,.26), inset 0 1px 0 rgba(255,255,255,.15);
  transition:filter .2s, transform .15s;
}
.amazon-link:hover { filter:brightness(1.06); transform:translateY(-1px); }
@media (max-height:900px) { .phone { transform:scale(.93); transform-origin:center; } }
@media (max-height:800px) { .phone { transform:scale(.83); } }
@media (max-width:420px) { .phone { width:100vw; height:100vh; border-radius:0; transform:none !important; } .page { padding:88px 26px 38px; } }
</style>
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/book-context.js" defer></script>
<script src="assets/theme.js" defer></script>
<script src="assets/travez.js" defer></script>
</head>
<body>
<div class="phone">
  <main class="page">
    <p class="eyebrow">IA Travez</p>
    <h1>Uma próxima leitura, escolhida com intenção.</h1>
    <p class="intro" id="suggestion-intro">Você acabou de atravessar A Metamorfose. Agora, Travez pode sugerir uma nova experiência literária a partir do que essa obra deixou em movimento.</p>

    <section class="travez-panel">
      <p class="travez-question">Que tipo de próxima experiência literária você deseja?</p>
      <div class="travez-options">
        <button class="travez-option" type="button" data-option="same_author" onclick="chooseTravezOption('same_author')">Quero conhecer mais obras do mesmo autor</button>
        <button class="travez-option" type="button" data-option="similar_style_or_theme" onclick="chooseTravezOption('similar_style_or_theme')">Quero algo parecido em estilo ou tema</button>
        <button class="travez-option" type="button" data-option="completely_new" onclick="chooseTravezOption('completely_new')">Quero uma experiência completamente nova</button>
      </div>
    </section>

    <p class="travez-status" id="travez-status" hidden></p>
    <div class="travez-results" id="travez-results"></div>
  </main>
</div>
</body>
</html>
